name: GolfSwing
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # DEVELOPMENT_TEAM: XXXXXXXXXX   # eigene Team-ID eintragen
targets:
  GolfSwing:
    type: application
    platform: iOS
    sources: [iOS, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.golfswing
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Golf Swing
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: GolfSwingWatch
        embed: true

  GolfSwingWatch:
    type: application
    platform: watchOS
    sources: [Watch, Shared]
    info:
      path: Watch/Info.plist
      properties:
        WKBackgroundModes: [workout-processing]
    entitlements:
      path: Watch/GolfSwingWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.golfswing.watchkitapp
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Golf Swing
        INFOPLIST_KEY_WKCompanionAppBundleIdentifier: com.example.golfswing
        INFOPLIST_KEY_WKRunsIndependentlyOfCompanionApp: NO
        INFOPLIST_KEY_NSMotionUsageDescription: Bewegungsdaten werden genutzt, um deinen Golfschwung aufzuzeichnen.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Eine Golf-Workout-Session ermöglicht die Hochfrequenz-Sensoraufnahme.
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Eine Golf-Workout-Session ermöglicht die Hochfrequenz-Sensoraufnahme.
